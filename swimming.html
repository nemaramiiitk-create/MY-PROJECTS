
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocean Swim Adventure</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 12px;
  background: #041d38;
  color: white;
  text-align: center;
  font-family: Arial, sans-serif;
}
h1 {
  margin: 5px;
  color: #67f5ff;
  text-shadow: 0 0 15px #00bfff;
}
p { color: #c7efff; }
#hud {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 12px;
}
.stat {
  background: #0b3760;
  border: 1px solid #2abde9;
  padding: 9px 13px;
  border-radius: 10px;
}
canvas {
  display: block;
  width: min(850px, 96vw);
  height: auto;
  margin: 0 auto;
  border: 2px solid #39d7ff;
  border-radius: 12px;
  box-shadow: 0 0 22px #00bfff55;
  touch-action: none;
}
.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 14px auto;
}
button {
  background: #0879a7;
  border: 1px solid #74edff;
  border-radius: 12px;
  padding: 13px 18px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  touch-action: none;
  cursor: pointer;
}
button:active { background: #0ebbd0; }
</style>
</head>
<body>

<h1>🌊 OCEAN SWIM</h1>
<p>Swim through the ocean, collect coins and avoid dangers!</p>

<div id="hud">
  <div class="stat">⭐ Score: <span id="score">0</span></div>
  <div class="stat">❤️ Lives: <span id="lives">3</span></div>
  <div class="stat">🏆 Best: <span id="best">0</span></div>
</div>

<canvas id="game" width="850" height="500"></canvas>

<div class="controls">
  <button id="left">⬅ Left</button>
  <button id="up">⬆ Up</button>
  <button id="down">⬇ Down</button>
  <button id="right">Right ➡</button>
  <button id="restart">🔄 Restart</button>
</div>

<p>Computer: Arrow keys / WASD &nbsp; | &nbsp; Mobile: Use buttons</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

let swimmer, obstacles, coins, bubbles;
let score, lives, frame, gameOver, invincible;
let keys = {};
let touch = {};
let best = 0;

try {
  best = Number(localStorage.getItem("oceanSwimBest")) || 0;
} catch (e) {}

document.getElementById("best").textContent = best;

function reset() {
  swimmer = { x: 115, y: H / 2, size: 22, speed: 4 };
  obstacles = [];
  coins = [];
  bubbles = [];
  score = 0;
  lives = 3;
  frame = 0;
  gameOver = false;
  invincible = 0;

  for (let i = 0; i < 28; i++) {
    bubbles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 2 + Math.random() * 5,
      speed: 0.5 + Math.random() * 1.3
    });
  }
  updateHUD();
}

function updateHUD() {
  document.getElementById("score").textContent = score;
  document.getElementById("lives").textContent = lives;
  document.getElementById("best").textContent = best;
}

function spawnObstacle() {
  const types = ["🪨", "🪼", "🐙"];
  obstacles.push({
    x: W + 30,
    y: 65 + Math.random() * (H - 130),
    size: 22 + Math.random() * 7,
    speed: 2 + Math.min(score / 200, 3),
    type: types[Math.floor(Math.random() * types.length)]
  });
}

function spawnCoin() {
  coins.push({
    x: W + 20,
    y: 55 + Math.random() * (H - 110),
    r: 13,
    spin: Math.random() * 6
  });
}

function hit(a, b, distance) {
  return Math.hypot(a.x - b.x, a.y - b.y) < distance;
}

function update() {
  frame++;

  for (const b of bubbles) {
    b.y -= b.speed;
    if (b.y < -10) {
      b.y = H + 10;
      b.x = Math.random() * W;
    }
  }

  if (gameOver) return;

  if (keys.ArrowLeft || keys.a || touch.left)
    swimmer.x -= swimmer.speed;
  if (keys.ArrowRight || keys.d || touch.right)
    swimmer.x += swimmer.speed;
  if (keys.ArrowUp || keys.w || touch.up)
    swimmer.y -= swimmer.speed;
  if (keys.ArrowDown || keys.s || touch.down)
    swimmer.y += swimmer.speed;

  swimmer.x = Math.max(30, Math.min(W - 30, swimmer.x));
  swimmer.y = Math.max(55, Math.min(H - 35, swimmer.y));

  if (invincible > 0) invincible--;

  // Spawn challenges
  if (frame % Math.max(35, 85 - Math.floor(score / 30)) === 0)
    spawnObstacle();

  if (frame % 80 === 0)
    spawnCoin();

  // Move obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= o.speed;

    if (o.x < -50) {
      obstacles.splice(i, 1);
      score += 1;
      continue;
    }

    if (invincible === 0 && hit(swimmer, o, o.size + 13)) {
      obstacles.splice(i, 1);
      lives--;
      invincible = 90;

      if (lives <= 0) gameOver = true;
    }
  }

  // Move coins
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.x -= 2.5;
    c.spin += 0.1;

    if (c.x < -20) {
      coins.splice(i, 1);
      continue;
    }

    if (hit(swimmer, c, 29)) {
      coins.splice(i, 1);
      score += 10;
    }
  }

  if (score > best) {
    best = score;
    try {
      localStorage.setItem("oceanSwimBest", best);
    } catch (e) {}
  }

  updateHUD();
}

function drawBackground() {
  const gradient = ctx.createLinearGradient(0, 0, 0, H);
  gradient.addColorStop(0, "#087bb0");
  gradient.addColorStop(0.5, "#04517f");
  gradient.addColorStop(1, "#022747");
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  // Sunlight rays
  ctx.save();
  ctx.globalAlpha = 0.10;
  ctx.fillStyle = "#a5ffff";
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(80 + i * 180, 0);
    ctx.lineTo(130 + i * 180, 0);
    ctx.lineTo(280 + i * 180, H);
    ctx.lineTo(210 + i * 180, H);
    ctx.fill();
  }
  ctx.restore();

  // Floating bubbles
  for (const b of bubbles) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.strokeStyle = "#a7efff99";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // Sea floor
  ctx.fillStyle = "#073d4b";
  ctx.fillRect(0, H - 22, W, 22);

  for (let i = 0; i < W; i += 35) {
    ctx.fillStyle = i % 2 ? "#20a58b" : "#dfbd70";
    ctx.fillRect(i, H - 22, 20, 5);
  }

  // Coral
  for (let i = 0; i < 8; i++) {
    const x = 25 + i * 120;
    ctx.strokeStyle = i % 2 ? "#ff788e" : "#ffb052";
    ctx.lineWidth = 7;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x, H - 22);
    ctx.lineTo(x, H - 48);
    ctx.lineTo(x - 12, H - 60);
    ctx.moveTo(x, H - 43);
    ctx.lineTo(x + 12, H - 54);
    ctx.stroke();
  }
}

function drawSwimmer() {
  if (invincible > 0 && Math.floor(frame / 5) % 2 === 0)
    return;

  ctx.save();
  ctx.translate(swimmer.x, swimmer.y);

  // Swim trail
  ctx.fillStyle = "#a5f6ff88";
  ctx.beginPath();
  ctx.ellipse(-28, 6, 13, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body
  ctx.fillStyle = "#ffb52e";
  ctx.beginPath();
  ctx.ellipse(0, 3, 20, 11, 0, 0, Math.PI * 2);
  ctx.fill();

  // Head
  ctx.fillStyle = "#ffd2a0";
  ctx.beginPath();
  ctx.arc(16, -6, 11, 0, Math.PI * 2);
  ctx.fill();

  // Swimming goggles
  ctx.fillStyle = "#152c4a";
  ctx.fillRect(19, -10, 7, 5);
  ctx.fillStyle = "#71faff";
  ctx.fillRect(21, -9, 3, 3);

  // Arms
  ctx.strokeStyle = "#ffd2a0";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(-2, -2);
  ctx.lineTo(-12, -14 + Math.sin(frame * 0.2) * 4);
  ctx.stroke();

  // Legs
  ctx.strokeStyle = "#ffcf8c";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(-12, 5);
  ctx.lineTo(-22, 14 + Math.sin(frame * 0.2) * 5);
  ctx.stroke();

  ctx.restore();
}

function draw() {
  drawBackground();

  // Decorative lane lines
  ctx.setLineDash([8, 12]);
  ctx.strokeStyle = "#ffffff25";
  for (let y = 100; y < H - 40; y += 100) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  for (const c of coins) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(Math.max(0.25, Math.abs(Math.cos(c.spin))), 1);
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#ffed60";
    ctx.fillStyle = "#ffd84a";
    ctx.beginPath();
    ctx.arc(0, 0, c.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#fff3a0";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();
  }

  for (const o of obstacles) {
    ctx.font = (o.size * 2) + "px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(o.type, o.x, o.y);
  }

  drawSwimmer();

  if (gameOver) {
    ctx.fillStyle = "#00152ddd";
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#65f4ff";
    ctx.font = "bold 46px Arial";
    ctx.fillText("GAME OVER!", W / 2, H / 2 - 50);

    ctx.fillStyle = "white";
    ctx.font = "bold 25px Arial";
    ctx.fillText("Your Score: " + score, W / 2, H / 2 + 5);

    ctx.font = "20px Arial";
    ctx.fillText("Press RESTART to swim again", W / 2, H / 2 + 48);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener("keydown", e => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key))
    e.preventDefault();
  keys[e.key] = true;
  keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
  keys[e.key] = false;
  keys[e.key.toLowerCase()] = false;
});

function hold(id, direction) {
  const btn = document.getElementById(id);

  btn.addEventListener("pointerdown", e => {
    e.preventDefault();
    touch[direction] = true;
    btn.setPointerCapture(e.pointerId);
  });

  const release = () => touch[direction] = false;
  btn.addEventListener("pointerup", release);
  btn.addEventListener("pointercancel", release);
  btn.addEventListener("lostpointercapture", release);
}

hold("left", "left");
hold("right", "right");
hold("up", "up");
hold("down", "down");

document.getElementById("restart").addEventListener("click", reset);

reset();
loop();
</script>
</body>
</html>
